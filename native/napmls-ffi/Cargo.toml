[package]
name = "napmls-ffi"
version = "0.1.0"
edition = "2021"

[dependencies]
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_sqlite_storage = "0.3.0"
openmls_traits = "0.6.0"
openmls_basic_credential = "0.6.0"
tls_codec = "0.5"

aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
log = "0.4"
thiserror = "1.0"
base64 = "0.22"
hex = "0.4"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
# 单个 codegen 单元 + 全量 LTO：把 openmls / rusqlite(bundled SQLite) 的跨 crate 内联做透，
# 缩小 cdylib 体积（默认配置下 DLL 为 6.18 MB）。
lto = "fat"
codegen-units = 1
# 剥离符号表：cdylib 不需要保留符号用于事后调试。
strip = "symbols"
# 必须保持 unwind！ffi.rs 全程依赖 catch_unwind 阻止 panic 跨越 C 边界；
# 改成 "abort" 会让所有 catch_unwind 失效，panic 直接终止宿主进程。
panic = "unwind"
