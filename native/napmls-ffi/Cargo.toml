[package]
name = "napmls-ffi"
version = "0.1.0"
edition = "2021"

[dependencies]
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_sqlite_storage = "0.3.0"
openmls_traits = "0.6.0"
openmls_basic_credential = "0.6.0"
tls_codec = "0.5"

aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
log = "0.4"
thiserror = "1.0"
base64 = "0.22"

[lib]
crate-type = ["cdylib"]
